version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: verity_secret
      POSTGRES_DB: verity_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity -d verity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  lancamentos:
    build: ./servicos/lancamentos
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://verity:verity_secret@postgres:5432/verity_db
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/lancamentos/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  consolidado:
    build: ./servicos/consolidado
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://verity:verity_secret@postgres:5432/verity_db
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lancamentos:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/consolidado/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  redisdata: